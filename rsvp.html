<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RSVP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f121b" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="rsvp.css" />
</head>
<body>
  <main class="rsvp-page">
    <div class="rsvp-card">
      <header class="rsvp-header">
        <h1 class="rsvp-title">RSVP</h1>
        <p class="rsvp-subtitle">Please enter your unique RSVP code to begin.</p>
      </header>

      <section id="code-section" class="code-section">
        <label for="rsvp-code" class="field-label">RSVP Code</label>
        <div class="code-input-row">
          <input type="text" id="rsvp-code" class="text-input" placeholder="Enter your code" />
          <button id="lookup-btn" class="primary-button">Continue</button>
        </div>
        <p id="code-message" class="message"></p>
      </section>

      <section id="form-section" class="form-section hidden">
        <div class="form-header">
          <h2 id="guest-display-name" class="guest-name"></h2>
          <p class="form-subtitle">You can RSVP for up to <span id="max-guests-text"></span> guest(s) with this code.</p>
        </div>

        <form id="rsvp-form">
          <div id="guest-blocks"></div>

          <div class="form-actions">
            <button type="submit" class="primary-button">Submit RSVP</button>
          </div>
          <p id="form-message" class="message"></p>
        </form>
      </section>
    </div>
  </main>

  <script src="rsvp.js"></script>
</body>
</html>
